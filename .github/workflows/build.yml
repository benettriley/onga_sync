name: ONGA Sync

# Every push builds every plug-in from its pinned ref in suite.sh, builds the ONGA Sync
# app, assembles the release (per-plug-in packages + catalog.json + installers), then on
# a clean macOS runner: installs the offline suite and validates every Audio Unit,
# installs each package with the exact script the app runs, checks the app sees them as
# current, screenshots the app, and uninstalls with the app's own uninstall scripts.
# Pushing a tag "v<SUITE_VERSION>" also publishes a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref_override:
        description: 'Testing only: build every tagged plug-in from this branch or tag (commit-pinned ones stay put)'
        required: false
        default: ''
      test_release:
        description: 'Testing only: publish this build as a pre-release (tag test-<run number>)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: ./scripts/plan.sh >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4

      # The plug-in repos are private: ONGA_REPOS_TOKEN (or ONGA_SYNC) is a token with
      # read access to their contents (a classic token with the repo scope works).
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ (inputs.ref_override != '' && !matrix.commit) && inputs.ref_override || matrix.tag }}
          path: src
          submodules: recursive
          token: ${{ secrets.ONGA_REPOS_TOKEN || secrets.ONGA_SYNC || github.token }}

      - name: Build universal bundles
        run: ./scripts/build_plugin.sh ${{ matrix.plugin }} src bundles

      # Artifacts drop file permissions, so the bundles travel as a tarball.
      - name: Pack
        run: tar -C bundles -czf bundles-${{ matrix.plugin }}.tgz ${{ matrix.plugin }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.plugin }}
          path: bundles-${{ matrix.plugin }}.tgz
          if-no-files-found: error

  app:
    runs-on: macos-14
    name: build ONGA Sync app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build app and CLI (universal)
        run: |
          cmake -S app -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)" --target OngaSync OngaSyncCli

      - name: Core tests
        run: build/OngaSyncCli_artefacts/Release/OngaSyncCli test

      - name: Pack
        run: |
          mkdir -p out
          ditto "build/OngaSync_artefacts/Release/ONGA Sync.app" "out/ONGA Sync.app"
          cp build/OngaSyncCli_artefacts/Release/OngaSyncCli out/
          sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*/\1/p' app/CMakeLists.txt > out/VERSION
          lipo -archs "out/ONGA Sync.app/Contents/MacOS/ONGA Sync" | grep -q arm64
          lipo -archs "out/ONGA Sync.app/Contents/MacOS/ONGA Sync" | grep -q x86_64
          tar -C out -czf sync-app.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: sync-app.tgz
          if-no-files-found: error

  assemble:
    needs: [plan, build, app]
    runs-on: macos-14
    env:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}   # job-level so step `if:`s can see it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: packed

      - uses: actions/download-artifact@v4
        with:
          name: sync-app
          path: packed-app

      - name: Unpack
        run: |
          mkdir -p bundles syncapp
          for t in packed/*.tgz; do tar -C bundles -xzf "$t"; done
          tar -C syncapp -xzf packed-app/sync-app.tgz
          ls bundles/* syncapp

      # Off until there's a Developer ID. Add the secrets and nothing else changes.
      - name: Import signing certificates
        if: ${{ env.MACOS_CERTS_P12 != '' }}
        env:
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          echo "$MACOS_CERTS_P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certs.p12

      - name: Assemble release
        env:
          ONGA_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          ONGA_INSTALLER_IDENTITY: ${{ secrets.INSTALLER_SIGN_IDENTITY }}
          ONGA_NOTARIZE: ${{ secrets.NOTARY_APPLE_ID != '' && '1' || '0' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ./scripts/assemble.sh bundles dist syncapp
          cat dist/packages/catalog.json

      - name: Offline suite installs everything (apps ticked) and every AU validates
        run: |
          . ./suite.sh
          cat > choices.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><array><dict>
            <key>choiceIdentifier</key><string>apps</string>
            <key>choiceAttribute</key><string>selected</string>
            <key>attributeSetting</key><integer>1</integer>
          </dict></array></plist>
          PLIST
          sudo installer -pkg "dist/Install ONGA Suite.pkg" -applyChoiceChangesXML choices.plist -target / -verbose
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for p in "${PLUGINS[@]}"; do
            load_plugin "$p"
            paths=("/Library/Audio/Plug-Ins/Components/$BUNDLE.component" "/Library/Audio/Plug-Ins/VST3/$BUNDLE.vst3")
            [[ "$APP" == 1 ]] && paths+=("/Applications/$BUNDLE.app")
            for path in "${paths[@]}"; do
              test -d "$path" || { echo "::error::installer did not create $path"; exit 1; }
              codesign --verify --strict "$path"
            done
            auval -v "${AUVAL[@]}" > "auval-$p.txt" || { tail -40 "auval-$p.txt"; echo "::error::auval failed for $p"; exit 1; }
            echo "auval ok: $p"
          done

      - name: Uninstall ONGA.pkg removes everything
        run: |
          . ./suite.sh
          sudo installer -pkg "dist/Uninstall ONGA.pkg" -target /
          for p in "${PLUGINS[@]}"; do
            load_plugin "$p"
            for path in "/Library/Audio/Plug-Ins/Components/$BUNDLE.component" "/Library/Audio/Plug-Ins/VST3/$BUNDLE.vst3" "/Applications/$BUNDLE.app"; do
              test ! -e "$path" || { echo "::error::uninstall left $path behind"; exit 1; }
            done
          done

      - name: The app installs, downloads every package, installs them, and sees them current
        run: |
          cli=syncapp/OngaSyncCli
          sudo installer -pkg "dist/Install ONGA Sync.pkg" -target /
          test -d "/Applications/ONGA Sync.app" || { echo "::error::ONGA Sync.app was not installed"; exit 1; }
          codesign --verify --strict "/Applications/ONGA Sync.app"

          # The app's downloader + checksum check, against every file in the catalog.
          "$cli" verify dist/packages/catalog.json

          # Install with the exact script the app runs as root.
          plugin_pkgs=()
          for f in dist/packages/*.pkg; do [[ "$(basename "$f")" == ONGA-Sync-* ]] || plugin_pkgs+=("$f"); done
          "$cli" install-script "${plugin_pkgs[@]}" > install.sh
          cat install.sh
          sudo sh install.sh
          "$cli" check dist/packages/catalog.json --expect-current

      - name: Screenshot the app
        continue-on-error: true
        run: |
          support="$HOME/Library/Application Support/ONGA/Sync"
          mkdir -p "$support"
          printf '{"catalogUrl": "%s"}' "$PWD/dist/packages/catalog.json" > "$support/settings.json"
          printf '{"userId":"developer","email":"dev@ongatools.local","displayName":"Developer","provider":"developer","licenses":[{"product":"*","kind":"developer","expires":0}]}' > "$support/account.json"
          # macOS has no timeout(1): run in the background, wait for the PNG, then stop it.
          shoot() {
            ONGA_SYNC_SNAPSHOT="$1" "/Applications/ONGA Sync.app/Contents/MacOS/ONGA Sync" &
            local pid=$! i
            for i in $(seq 60); do [[ -s "$1" ]] && break; sleep 1; done
            sleep 1; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          }
          mkdir -p shots
          shoot "$PWD/shots/onga-sync-library.png"
          rm "$support/account.json"
          shoot "$PWD/shots/onga-sync-sign-in.png"
          ls -la shots

      - name: The app's uninstall script removes each plug-in
        run: |
          . ./suite.sh
          cli=syncapp/OngaSyncCli
          for p in "${PLUGINS[@]}"; do
            load_plugin "$p"
            "$cli" uninstall-script dist/packages/catalog.json "$p" > "uninstall-$p.sh"
            sudo sh "uninstall-$p.sh"
            for path in "/Library/Audio/Plug-Ins/Components/$BUNDLE.component" "/Library/Audio/Plug-Ins/VST3/$BUNDLE.vst3" "/Applications/$BUNDLE.app"; do
              test ! -e "$path" || { echo "::error::app uninstall left $path behind"; exit 1; }
            done
            echo "uninstalled: $p"
          done
          sudo installer -pkg "dist/Uninstall ONGA.pkg" -target /
          test ! -e "/Applications/ONGA Sync.app" || { echo "::error::Uninstall ONGA.pkg left ONGA Sync.app behind"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ONGA-Sync-${{ needs.plan.outputs.version }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match SUITE_VERSION $VERSION in suite.sh"; exit 1; }
          ./scripts/release_notes.sh "ONGA Sync library $VERSION" > notes.md
          cp "dist/Install ONGA Suite.pkg" "dist/ONGA-Suite-$VERSION.pkg"
          files=(dist/ONGA-Sync-*.dmg "dist/ONGA-Suite-$VERSION.pkg" dist/packages/*)
          # The release may already exist (published from the web to create the tag):
          # then fill it in instead of creating it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "ONGA Sync $VERSION" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "ONGA Sync $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Publish test pre-release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="test-${GITHUB_RUN_NUMBER}"
          ./scripts/release_notes.sh "Test build of ONGA Sync $VERSION from ${{ inputs.ref_override || 'the pinned refs' }}. Not a release." > notes.md
          echo "Point ONGA Sync at it: SOURCE... -> https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/catalog.json" >> notes.md
          cp "dist/Install ONGA Suite.pkg" "dist/ONGA-Suite-$VERSION.pkg"
          gh release create "$tag" dist/ONGA-Sync-*.dmg "dist/ONGA-Suite-$VERSION.pkg" \
            dist/packages/* \
            --title "ONGA Sync $VERSION (test build $GITHUB_RUN_NUMBER)" --notes-file notes.md \
            --prerelease --target "$GITHUB_SHA"
